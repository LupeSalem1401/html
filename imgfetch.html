<!DOCTYPE html>
<html>
<head>
<title>Ejemplo Fetch Fotos</title>
<style>
/* Un poco de CSS para que la galería se vea ordenada */
#galeria {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
gap: 16px;
padding: 16px;
}

#galeria div {
text-align: center;
}
#galeria img {
width: 100%;
height: 150px;
object-fit: cover;
border-radius: 8px;
}
#galeria p {
font-size: 14px;
margin-top: 8px;
}
</style>
</head>
<body>
<h1>Galería de Fotos</h1>
<div id="galeria"></div>
<script>
const galeria = document.getElementById("galeria");
// Traemos 5 fotos de prueba
fetch("https://jsonplaceholder.typicode.com/photos?_limit=5")
.then(respuesta => respuesta.json())
.then(fotos => {
fotos.forEach(foto => {
const div = document.createElement("div");
const img = document.createElement("img");
// Usamos Picsum en lugar de foto.thumbnailUrl
// Usamos el id de la foto para que cada imagen sea diferente
img.src = `https://picsum.photos/id/${foto.id}/150/150`;
img.alt = foto.title;
const p = document.createElement("p");
p.textContent = foto.title;
div.appendChild(img);
div.appendChild(p);
galeria.appendChild(div);
});
})
.catch(error => {
console.error("Error al cargar fotos:", error);
});
</script>
</body>

</html>
